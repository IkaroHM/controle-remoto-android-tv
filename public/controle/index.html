<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="controle">

        <div class="dpad">

            <button class="up"    aria-label="Cima" id="botaoUp">▲</button>

            <button class="left"  aria-label="Esquerda" id="botaoLeft">◄</button>

            <button class="ok"    aria-label="OK" id="botaoOk">OK</button>

            <button class="right" aria-label="Direita" id="botaoRight">►</button>
            
            <button class="down"  aria-label="Baixo" id="botaoDown">▼</button>

        </div>

        <div class="painelNavegacao">
            <button id="botaoHome" class="botaoNavegacao">⌂</button>
            <button id="botaoBack" class="botaoNavegacao">←</button>
        </div>

        <div class="vol">
            <button id="volUp" class="botaoVol"><p>+</p></button>
            <div id="volIcon"><p>🕨</p></div>
            <button id="volDown" class="botaoVol"><p>-</p></button>
        </div>

        <a href="/home/">←</a>

    </main>

    <footer><p>Feito por Íkaro</p></footer>

    <script src="app.js"></script>
</body>
</html>
